 <meta name="description" content="Browse FrameDeer's comprehensive TV series reviews collection. Filter by genre, search shows, and discover detailed analysis of television from classic to contemporary.">

</head>
<body>
   <!-- Navigation -->

          <img src="/assets/logo/framedeer.png" alt="FrameDeer Logo - Movie Reviews and Ratings" class="nav-logo-img">

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" id="mobileMenuOverlay">
    <button class="close-menu" id="closeMenuBtn" aria-label="Close mobile menu">
    </button>
    <ul class="mobile-nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/movies.html">Movies</a></li>
      <li><a href="/series.html">Series</a></li>
      <li><a href="/focus.html">Focus</a></li>

      <li><a href="/tournament.html">Tournament</a></li>

    </ul>

  <main class="container" style="padding: 1rem; max-width: 1100px; margin: 0 auto; margin-top: 2rem;">
    <section id="profileSection" class="actor-profile"></section>
    <section id="awardsSection" class="awards"></section>
    <section id="filmographySection" class="filmography"></section>
    <section id="signatureSection" class="signature-style"></section>
    <section id="collabsSection" class="collaborators"></section>
    <section id="triviaSection" class="trivia"></section>
  </main>

  <footer>
    <p>© 2025 Movie Review Library</p>
  </footer>

  <script>
    const $ = (s, r=document)=>r.querySelector(s);
    const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));
    const getParam = (n)=>new URLSearchParams(location.search).get(n);

    function renderProfile(p){
      const el = $('#profileSection');
      const attrs = p.attributes || {};
      const rows = Object.entries(attrs).map(([k,v])=>`<p><strong>${k.replace(/_/g,' ')}:</strong> ${v}</p>`).join('');
      el.innerHTML = `
        <section class="actor-profile" style="display:flex; gap: 1.5rem; align-items:flex-start; flex-wrap: wrap;">
          <img src="${p.photo || ''}" alt="${p.name || ''}" class="actor-photo" style="width:220px; border-radius:8px;" />
          <div class="actor-info">
            <h1>${p.name || ''}</h1>
            ${rows}
            ${p.bio ? `<p class=\"bio\">${p.bio}</p>`: ''}
            ${(p.early_career?.paragraphs||[]).length ? `<div class=\"early-career\"><h3>${p.early_career.title || 'Early Career'}</h3>${p.early_career.paragraphs.map(x=>`<p>${x}</p>`).join('')}</div>`:''}
          </div>
        </section>`;
    }

    function renderAwards(p){
      const el = $('#awardsSection');
      const items = p.awards || [];
      if (!items.length){ el.innerHTML=''; return; }
      el.innerHTML = `<h2>Major Awards</h2><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    }

    function renderFilmography(p){
      const el = $('#filmographySection');
      const major = p.filmography?.major || [];
      const other = p.filmography?.other || [];
      const majorHtml = major.map(m=>{
        const movieId = m.link ? (m.link.match(/\/moviereviews\/([^/]+)\.html/i)||[])[1] : null;
        const href = movieId ? `moviedetail.html?id=${encodeURIComponent(movieId)}` : (m.link || '#');
        return `<a href=\"${href}\" class=\"movie-card\"><img src=\"${m.image || ''}\" alt=\"${m.title || ''}\"><p>${m.raw || m.title || ''}</p></a>`;
      }).join('');
      const otherHtml = other.map(o=>{
        const movieId = o.link ? (o.link.match(/\/moviereviews\/([^/]+)\.html/i)||[])[1] : null;
        const href = movieId ? `moviedetail.html?id=${encodeURIComponent(movieId)}` : (o.link || '#');
        return `<a href=\"${href}\" class=\"text-movie-link\">${o.text || ''}</a>`;
      }).join('');
      el.innerHTML = `
        <h2>Filmography</h2>
        ${major.length ? `<div class=\"movie-grid\" style=\"display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem;\">${majorHtml}</div>`: ''}
        ${other.length ? `<div class=\"text-movie-list\"><h3>Other Notable Works</h3><div class=\"text-movie-grid\">${otherHtml}</div></div>`: ''}
      `;
    }

    function renderSignature(p){
      const el = $('#signatureSection');
      const items = p.signature_style || [];
      if (!items.length){ el.innerHTML=''; return; }
      el.innerHTML = `<h2>Signature Style & Themes</h2><div class=\"style-grid\" style=\"display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;\">${items.map(i=>`<div class=\"style-item\"><h3>${i.title || ''}</h3><p>${i.text || ''}</p></div>`).join('')}</div>`;
    }

    function renderCollabs(p){
      const el = $('#collabsSection');
      const items = p.collaborators || [];
      if (!items.length){ el.innerHTML=''; return; }
      el.innerHTML = `<h2>Frequent Collaborators</h2><div class=\"collaborator-grid\" style=\"display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;\">${items.map(i=>`<div class=\"collaborator-item\"><h3>${i.name || ''}</h3><p>${i.text || ''}</p></div>`).join('')}</div>`;
    }

    function renderTrivia(p){
      const el = $('#triviaSection');
      const items = p.trivia || [];
      if (!items.length){ el.innerHTML=''; return; }
      el.innerHTML = `<h2>Notable Trivia</h2><div class=\"trivia-grid\" style=\"display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;\">${items.map(i=>`<div class=\"trivia-item\"><h3>${i.title || ''}</h3><p>${i.text || ''}</p></div>`).join('')}</div>`;
    }

    async function main(){
      const id = getParam('id');
      if (!id){ $('#profileSection').innerHTML = '<p class="error">Missing director id.</p>'; return; }
      if (location.protocol === 'file:') {
        $('#profileSection').innerHTML = '<p class="error">This page loads data via fetch. Please run a local server (e.g., <code>python3 -m http.server 5500</code>) and open <code>http://localhost:5500/directordetail.html?id='+id+'</code>.</p>';
        return;
      }
      try{
        const res = await fetch(new URL('directors.json', location.href));
        if (!res.ok) throw new Error('directors.json HTTP '+res.status);
        const data = await res.json();
        const person = data[id];
        if (!person){ $('#profileSection').innerHTML = '<p class="error">Director not found for id: '+id+'</p>'; return; }
        renderProfile(person);
        renderAwards(person);
        renderFilmography(person);
        renderSignature(person);
        renderCollabs(person);
        renderTrivia(person);
      }catch(e){
        console.error(e);
        $('#profileSection').innerHTML = '<p class="error">Failed to load director details. '+(e && e.message ? e.message : '')+'</p>';
      }
    }

    main();

    // Mobile menu functionality
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
    const mobileNavLinks = document.querySelectorAll('.mobile-nav-links a');

    function toggleMobileMenu() {
      const isActive = mobileMenuOverlay.classList.contains('active');
      if (isActive) {
        mobileMenuOverlay.classList.remove('active');
        mobileMenuBtn.classList.remove('active');
        document.body.style.overflow = 'auto';
      } else {
        mobileMenuOverlay.classList.add('active');
        mobileMenuBtn.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeMobileMenu() {
      mobileMenuOverlay.classList.remove('active');
      mobileMenuBtn.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    mobileMenuBtn.addEventListener('click', toggleMobileMenu);
    closeMenuBtn.addEventListener('click', closeMobileMenu);
    mobileNavLinks.forEach(link => link.addEventListener('click', closeMobileMenu));
  </script>
</body>
</html>
